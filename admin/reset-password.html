<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Đặt lại mật khẩu | AYS Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Potta+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <a class="admin-brand" href="../index.html" aria-label="Về website AYS">
      <span class="brand-mark">AYS</span>
      <span>ADORABLE<br><em>YARD SANCTUARY</em></span>
    </a>

    <section class="admin-card" aria-labelledby="reset-title">
      <p class="eyebrow">Khu vực quản trị</p>
      <h1 id="reset-title">Đặt lại mật khẩu</h1>
      <p class="admin-intro">Tạo mật khẩu mới cho tài khoản quản trị.</p>

      <form id="admin-reset-form" hidden>
        <label for="new-password">Mật khẩu mới</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirm-password">Nhập lại mật khẩu mới</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button class="button button-dark full-width" type="submit">Lưu mật khẩu mới</button>
      </form>

      <p id="reset-message" class="admin-message" role="status" aria-live="polite">Đang xác thực link khôi phục…</p>
      <a id="reset-login-link" class="admin-reset-link" href="./index.html" hidden>Về trang đăng nhập</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
