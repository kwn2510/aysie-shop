<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản lý đơn hàng | AYS Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Potta+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page admin-products-page">
  <main class="admin-products-shell">
    <header class="admin-products-header">
      <a class="admin-brand" href="./index.html" aria-label="Về admin AYS">
        <span class="brand-mark">AYS</span>
        <span>AYS · QUẢN TRỊ</span>
      </a>
      <div class="admin-header-actions">
        <a class="admin-signout" href="./products.html">Quản lý sản phẩm</a>
        <a class="admin-signout" href="./reviews.html">Duyệt đánh giá</a>
        <a class="admin-signout" href="./customers.html">Khách hàng</a>
        <a class="admin-signout" href="./gacha.html">Gacha Garden</a>
        <a class="admin-signout" href="../index.html">Xem cửa hàng</a>
        <button id="orders-signout" class="admin-signout" type="button">Đăng xuất</button>
      </div>
    </header>

    <section class="admin-orders-panel" aria-labelledby="orders-heading">
      <div class="admin-list-heading">
        <div>
          <p class="eyebrow">AYS Admin</p>
          <h1 id="orders-heading">Quản lý đơn hàng</h1>
        </div>
        <button id="reload-orders" class="admin-signout" type="button">Tải lại</button>
      </div>
      <p class="admin-orders-note">Bill thanh toán vẫn được gửi đến email shop như hiện tại.</p>
      <p id="orders-message" class="admin-message" role="status" aria-live="polite">Đang tải đơn hàng…</p>
      <nav class="admin-order-views" aria-label="Lọc đơn hàng">
        <button class="admin-signout admin-order-view is-active" type="button" data-order-view="processing" aria-pressed="true">Đang xử lý</button>
        <button class="admin-signout admin-order-view" type="button" data-order-view="fulfilled" aria-pressed="false">Đã giao mầm</button>
        <button class="admin-signout admin-order-view" type="button" data-order-view="cancelled" aria-pressed="false">Đã hủy</button>
      </nav>
      <div id="admin-order-list" class="admin-order-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="orders.js"></script>
</body>
</html>
